<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Testimonial Slider</title>
        <link rel="stylesheet" href="slider.css">
      </head>
      
      <body>
        <div class="content-wrapper rollIn">
          <h1>Our Reviews</h1>
          <div class="blue-line"></div>
          <div class="wrapper-for-arrows"  data-aos="fade-up" data-aos-delay="200" data-aos-duration="1000" >
            <div style="opacity: 0;" class="chicken"></div>
            <div id="reviewWrap" class="review-wrap">
              <div id="imgDiv" class="">
              </div>
              <div id="personName"></div>
              <div id="profession"></div>
              <div id="description">
              </div>
            </div>
            <div id="surpriseMeBtn" class="surprise-me-btn">Surprise me</div>
            <div class="left-arrow-wrap arrow-wrap">
              <div class="arrow" id="leftArrow"></div>
            </div>
            <div class="right-arrow-wrap arrow-wrap">
              <div class="arrow" id="rightArrow"></div>
            </div>
          </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js" integrity="sha512-Eak/29OTpb36LLo2r47IpVzPBLXnAMPAVypbSZiZ4Qkf8p/7S/XRG5xp7OKWPPYfJT6metI+IORkR5G8F900+g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js" integrity="sha512-Rd5Gf5A6chsunOJte+gKWyECMqkG8MgBYD1u80LOOJBfl6ka9CtatRrD4P0P5Q5V/z/ecvOCSYC8tLoWNrCpPg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        
        <script src="slider.js"></script>
      </body>
</html>
